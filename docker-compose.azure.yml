services:
  aipfa:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      BASE_URL: https://${AIPFA_DOMAIN:?Set AIPFA_DOMAIN in .env}
      TRUST_PROXY: "1"
      DB_PATH: /data/finassist.db
      HF_HOME: /data/huggingface
      DEMO_SEED: "false"
    volumes:
      - /mnt/aipfa-data:/data
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/me').then((r) => process.exit(r.status === 401 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    environment:
      AIPFA_DOMAIN: ${AIPFA_DOMAIN:?Set AIPFA_DOMAIN in .env}
    depends_on:
      aipfa:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/caddy-data:/data
      - /mnt/caddy-config:/config
    restart: unless-stopped
